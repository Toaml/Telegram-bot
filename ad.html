<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Advertisement</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .ad-box {
            width: 100%;
            max-width: 420px;
            min-height: 250px;
            background: #222;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ad-button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .info {
            color: #aaa;
            font-size: 13px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="title">
        Advertisement
    </div>

    <div class="ad-box">
        <span style="color:#888;">
            Advertisement
        </span>
    </div>

    <a
        class="ad-button"
        href="https://www.profitableratecpmnetwork.com/vtaddgsm?key=bf49aea0b2b6e72b6d744dc6a9971422"
        target="_blank"
        rel="noopener noreferrer"
    >
        🔗 Open Advertisement
    </a>

    <div class="info">
        বিজ্ঞাপনটি দেখার পর Back চাপুন এবং Telegram-এ ফিরে যান।
    </div>

</div>

</body>
  </html>
